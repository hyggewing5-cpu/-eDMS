<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eDMS</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#4f46e5;--brand-2:#7c3aed;--brand-soft:#eef0ff;--bg:#f5f6fb;--surface:#fff;
  --text:#1e2235;--muted:#6b7285;--border:#e6e8f0;--ok:#16a34a;--ok-soft:#e8f7ee;
  --danger:#dc2626;--danger-soft:#fdecec;--warn:#d97706;--radius:14px;
  --shadow:0 1px 2px rgba(30,34,53,.05),0 4px 16px rgba(30,34,53,.06);
  --shadow-lg:0 20px 50px rgba(30,34,53,.22);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Inter','Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#cdd1e2;background:#fafbff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:0;box-shadow:0 4px 14px rgba(79,70,229,.35)}
.btn-primary:hover{filter:brightness(1.07);background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);border-color:#f6c7c7}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn-icon{padding:7px;border-radius:9px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 12px;outline:none;transition:.15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
textarea.inp{resize:vertical;min-height:76px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px}
.chk input{width:17px;height:17px;accent-color:var(--brand)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:radial-gradient(900px 500px at 10% 0%,#7c3aed 0%,transparent 60%),radial-gradient(700px 500px at 100% 100%,#2563eb 0%,transparent 55%),#1e1b4b;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art:before,.login-art:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.06)}
.login-art:before{width:420px;height:420px;right:-120px;top:20%}
.login-art:after{width:260px;height:260px;left:-80px;bottom:-60px}
.login-art h1{font-size:38px;line-height:1.2;font-weight:700;max-width:460px;position:relative}
.login-art p{opacity:.8;max-width:420px;margin-top:14px;position:relative}
.feat{display:grid;gap:12px;position:relative}
.feat div{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.1);backdrop-filter:blur(6px);padding:12px 16px;border-radius:12px;max-width:420px}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px;position:relative}
.login-card{width:100%;max-width:390px}
.login-card h2{font-size:26px;margin-bottom:4px}
.login-card .sub{color:var(--muted);margin-bottom:26px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.4)}
.login-art .logo{background:rgba(255,255,255,.18);box-shadow:none}
.langsw{position:absolute;top:22px;right:24px}
@media(max-width:900px){.login{grid-template-columns:1fr}.login-art{display:none}}

/* shell */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:4px 10px 18px}
.nav-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9aa0b4;font-weight:600;padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#4a5068;cursor:pointer;font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:#f3f4fa}
.nav.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;background:rgba(245,246,251,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}
.top .grow{flex:1}
.gsearch{position:relative;max-width:420px;flex:1}
.gsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gsearch .inp{padding-left:38px;background:#fff}
.user{display:flex;align-items:center;gap:10px;cursor:pointer;padding:5px 8px;border-radius:12px;position:relative}
.user:hover{background:#fff}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,var(--brand-2));color:#fff;display:grid;place-items:center;font-weight:600}
.user small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.user b{font-size:13.5px;line-height:1.2}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);min-width:210px;padding:6px;z-index:40}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:#f3f4fa}
.content{padding:28px;max-width:1280px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h h2{font-size:24px;font-weight:700}
.page-h p{color:var(--muted);margin-top:2px}
.burger{display:none}
@media(max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.25s;width:272px;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(20,22,40,.45);z-index:50}
  .burger{display:inline-flex}
  .content{padding:18px}.top{padding:12px 16px}.user div{display:none}
}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.stat{padding:18px;display:flex;gap:14px;align-items:center}
.stat .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center}
.stat b{font-size:26px;line-height:1.1;display:block}
.stat span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.card-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.card-b{padding:8px 20px 14px}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #f0f1f6}
.li:last-child{border:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{color:var(--muted);font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:44px 16px}
.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:8px}

/* badges / ext */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.badge.gray{background:#eff0f5;color:#555b73}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.ext{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;flex:none}

/* documents */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar .inp{width:auto;min-width:170px}
.toolbar .grow{flex:1;min-width:220px;position:relative}
.toolbar .grow .inp{width:100%;padding-left:38px}
.toolbar .grow svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.doc{padding:18px 20px;margin-bottom:14px}
.doc-h{display:flex;gap:14px;align-items:flex-start}
.doc-h .grow{flex:1;min-width:0}
.doc h3{font-size:16.5px;font-weight:650;line-height:1.35}
.doc .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px;color:var(--muted);font-size:12.5px}
.doc .desc{color:#4a5068;margin:10px 0 2px}
.files{margin-top:12px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.file{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);background:#fcfcff}
.file:last-child{border:0}
.file .grow{flex:1;min-width:0}
.file .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .s{font-size:12px;color:var(--muted)}
.file .ext{width:34px;height:34px;font-size:9.5px;border-radius:9px}
.tick{width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 4px var(--ok-soft)}
.tick svg{width:14px;height:14px;stroke-width:3}
.tick.off{background:#eceef5;box-shadow:none;color:transparent}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:20px;flex-wrap:wrap}
.pager .btn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.skel{height:110px;border-radius:14px;background:linear-gradient(90deg,#eceef5 25%,#f6f7fb 37%,#eceef5 63%);background-size:400% 100%;animation:sk 1.3s infinite;margin-bottom:14px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* table */
.tbl-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:12px 16px;background:#fafbff;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid #f0f1f6;vertical-align:middle}
tr:hover td{background:#fafbff}
.acts{display:flex;gap:6px;justify-content:flex-end}

/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(20,22,40,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:100;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);animation:pop .18s}
.modal.sm{max-width:430px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:18px}
.modal-b{padding:20px 22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#fafbff;border-radius:0 0 18px 18px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:200}
.toast{background:#1e2235;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;max-width:380px;animation:pop .2s}
.toast.ok svg{color:#4ade80}.toast.error svg{color:#f87171}

/* chips, dropzone */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:#fff;padding:6px 13px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;transition:.15s}
.chip:hover{border-color:#bfc4dc}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.drop{border:2px dashed #cfd3e8;border-radius:14px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:#fafbff}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.sel{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin-top:8px;background:#fff}
.sel .grow{flex:1;min-width:0}
.sel .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:13.5px}
.sel select{width:auto;padding:5px 8px;font-size:12.5px}
.linkrow{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:8px;margin-top:8px}
@media(max-width:640px){.linkrow{grid-template-columns:1fr 1fr}}
.modal.xl{max-width:1000px}
.frm{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;align-items:start;margin-bottom:14px}
.frm.two{grid-template-columns:150px 1fr 150px 1fr}
.frm>label{font-size:13px;font-weight:600;color:var(--muted);padding-top:10px}
.req{color:var(--danger)}
@media(max-width:820px){.frm,.frm.two{grid-template-columns:1fr}.frm>label{padding-top:0}}
.ig{display:flex;gap:6px}.ig .inp{flex:1;min-width:0}
.ig .btn{padding:8px 11px}
.radios{display:flex;gap:18px;align-items:center;padding-top:9px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;cursor:pointer;font-weight:500;font-size:14px;color:var(--text);padding:0}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin:6px 0 12px;padding-top:8px;border-top:1px dashed var(--border)}
.badge.warn{background:#fff4e0;color:#b45309}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 20px;margin-top:12px;font-size:13px;color:#4a5068}
.info b{color:var(--muted);font-weight:600}
.pick-bg{position:fixed;inset:0;background:rgba(20,22,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px;z-index:150}
.pick{background:#fff;border-radius:16px;width:100%;max-width:440px;box-shadow:var(--shadow-lg);overflow:hidden}
.pick-list{max-height:320px;overflow:auto;padding:6px}
.pick-item{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer}
.pick-item:hover{background:var(--brand-soft)}
.pick-item small{color:var(--muted)}
.bar{height:6px;border-radius:99px;background:#eceef5;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));width:0;transition:.2s}

/* register table */
.nav.grp .chev{margin-left:auto;font-size:11px;opacity:.6}
.subnav{display:grid;gap:2px;margin:2px 0 6px 14px;padding-left:10px;border-left:2px solid var(--border)}
.subnav .nav{padding:8px 12px;font-size:13.5px}
.rt-bar,.rt-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px}
.rt-bar label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
.rt-bar .inp{width:auto;padding:7px 10px}
.rt-foot{border-top:1px solid var(--border);color:var(--muted);font-size:13px}
.rpg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rpg .pgin{width:58px;padding:5px 8px;text-align:center}
.rt th.sortable{cursor:pointer;user-select:none}.rt th .sa{margin-left:6px;font-size:10px;opacity:.35}.rt th .sa.on{opacity:1;color:var(--brand)}
.rt td.c{text-align:center;width:44px}.rt td.num{font-weight:600;white-space:nowrap}
.rt tr.clk{cursor:pointer}.rt .t{font-weight:600}
.rt .parties{margin-top:4px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.lb{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:1px 8px;border-radius:5px}.lb.teal{background:#14b8a6}.lb.blue{background:#3b82f6}
.mini{display:inline-block;margin:3px 4px 0 0;font-size:11px;font-weight:600;padding:1px 8px;border-radius:5px;background:var(--brand-soft);color:var(--brand)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}.dot.ok{background:var(--ok)}.dot.warn{background:#f59e0b}.dot.red{background:var(--danger)}
.fi{position:relative;color:#c81e1e;display:inline-flex;align-items:flex-start}.fi sup{font-size:10px;font-weight:700;margin-left:1px;color:var(--muted)}
.modal.md{max-width:780px}
</style>
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>
<div id="toasts"></div>

<script>

const API_URL=(window.EDMS_CONFIG&&window.EDMS_CONFIG.apiUrl)||'';
const IN_GAS=typeof google!=='undefined'&&google.script&&google.script.run;
function API(method,payload){
  return new Promise((resolve,reject)=>{
    const done=raw=>{
      let r=null; try{ r=JSON.parse(raw); }catch(e){}
      if(r&&r.ok) return resolve(r.data);
      const e=(r&&r.error)||'ERROR';
      if(e==='SESSION_EXPIRED') sessionLost();
      reject(new Error(e));
    };
    if(IN_GAS){ // รันใน Apps Script เอง
      google.script.run.withSuccessHandler(done)
        .withFailureHandler(e=>reject(new Error((e&&e.message)||'ERROR'))).api(method,S.token,payload||{});
      return;
    }
    if(!/^https:\/\/script\.google\.com\//.test(API_URL)) return reject(new Error('NOCONFIG'));
    // POST แบบ text/plain (ไม่มี preflight) ไปยัง Apps Script Web App
    fetch(API_URL,{method:'POST',redirect:'follow',body:JSON.stringify({method:method,token:S.token,payload:payload||{}})})
      .then(r=>r.text()).then(done).catch(()=>reject(new Error('NETWORK')));
  });
}

function toast(msg,type){
  const el=document.createElement('div'); el.className='toast '+(type||'ok');
  el.innerHTML=`${ic(type==='error'?'x':'check')}<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el); setTimeout(()=>el.remove(),3800);
}

const fmtD = iso => { if(!iso) return '-'; const m=String(iso).slice(0,10).split('-'); if(m.length<3) return iso; return S.lang==='en'?`${m[2]}/${m[1]}/${m[0]}`:`${m[2]}/${m[1]}/${+m[0]+543}`; };

function extInfo(f){

   zip:['ZIP','#eceef5','#475069'],rar:['ZIP','#eceef5','#475069'],txt:['TXT','#eceef5','#475069']}[e];
  return m?{l:m[0],bg:m[1],c:m[2]}:{l:(e||'FILE').slice(0,4).toUpperCase(),bg:'#eceef5',c:'#475069'};

function b64Blob(b64,mime){
  const bin=atob(b64),len=bin.length,out=new Uint8Array(len);
  for(let i=0;i<len;i++) out[i]=bin.charCodeAt(i);
  return new Blob([out],{type:mime||'application/octet-stream'});
}
function saveBlob(blob,name){

}

async function doLogin(e){
  e.preventDefault(); const b=$('#lb'); b.disabled=true;
  try{
    const r=await API('login',{username:$('#lu').value,password:$('#lp').value});
    S.token=r.token; localStorage.setItem('edms_token',r.token);

    await loadBoot(); await enterApp();

async function getFile(fileId,mode,btn){
  let w=null;
  if(mode==='link'||mode==='view'){ w=window.open('about:blank','_blank'); }
  const old=btn.innerHTML; btn.disabled=true; btn.innerHTML='…';
  try{
    const r=await API('files.fetch',{fileId,mode});
    if(r.type==='link'){ if(w){w.opener=null;w.location=r.url;} else window.open(r.url,'_blank','noopener'); }
    else{
      const blob=b64Blob(r.base64,r.mime);
      if(r.mode==='view'){
        if(w){ w.location=URL.createObjectURL(blob); }
        else { toast(t('popup')); saveBlob(blob,r.name); }
      }else{ if(w)w.close(); saveBlob(blob,r.name); }
    }
    markDownloaded(fileId);
  }catch(e){ if(w)w.close(); toast(errMsg(e),'error'); btn.disabled=false; btn.innerHTML=old; }
}
async function delDoc(id){
  if(!await confirmBox(t('confirmDelDoc'))) return;

    <div style="padding:12px 14px 4px"><input class="inp" id="pkq" placeholder="${esc(t('pickSearch'))}" oninput="window._pkdraw()"></div><div class="pick-list" id="pkl"></div></div></div>`;
  window._pkdraw=draw; draw(); $('#pkq').focus();
  if(kind==='org'){ try{ const more=await API('orgs.list'); const have=new Set(items.map(i=>i.n)); more.forEach(n=>{ if(!have.has(n)) items.push({n,s:''}); }); if($('#pkl')) draw(); }catch(e){} }
}
function renderDeptChips(){
  const all=F.deptIds.includes('ALL');
  $('#fDepts').innerHTML=`<span class="chip ${all?'on':''}" onclick="toggleDept('ALL')">${t('allDeptsChip')}</span>`+
    S.boot.departments.filter(d=>d.Active||F.deptIds.includes(d.DeptID)).map(d=>`<span class="chip ${F.deptIds.includes(d.DeptID)&&!all?'on':''}" onclick="toggleDept('${d.DeptID}')">${esc(lname(d))}</span>`).join('');
}
function toggleDept(id){
  if(id==='ALL') F.deptIds = F.deptIds.includes('ALL')?[]:['ALL'];
  else{ F.deptIds=F.deptIds.filter(x=>x!=='ALL'); const i=F.deptIds.indexOf(id); i>=0?F.deptIds.splice(i,1):F.deptIds.push(id); }
  renderDeptChips();
}
const modeSel = (cur,cb) => `<select class="inp" onchange="${cb}">${[['default',t('mDefault')],['download',t('mDownload')],['view',t('mView')]].map(([v,l])=>`<option value="${v}" ${cur===v?'selected':''}>${l}</option>`).join('')}</select>`;
function renderExisting(){
  const box=$('#fExistBox'); const list=F.existing.filter(f=>!F.removeIds.includes(f.FileID));
  box.innerHTML = list.length ? `<label>${t('existing')}</label>`+list.map(f=>`<div class="sel">${extBox(f)}<div class="grow"><div class="n">${esc(f.Name)}</div></div>
    ${f.Type==='file'?modeSel(F.modes[f.FileID]||f.AccessMode,`F.modes['${f.FileID}']=this.value`):''}
    <button class="btn btn-sm btn-icon btn-danger" onclick="F.removeIds.push('${f.FileID}');renderExisting()">${ic('trash')}</button></div>`).join('') : '';
}
function addFiles(list){
  const max=S.boot.settings.MaxFileMB*1048576;
  [...list].forEach(f=>{ if(f.size>max) toast(`${f.name}: ${t('tooBig')} (${S.boot.settings.MaxFileMB} MB)`,'error'); else F.files.push({file:f,mode:'default'}); });
  renderSelFiles();
}
function renderSelFiles(){
  $('#fFiles').innerHTML=F.files.map((x,i)=>`<div class="sel">${extBox({Name:x.file.name,Type:'file'})}<div class="grow"><div class="n">${esc(x.file.name)}</div><div class="s" style="font-size:12px;color:var(--muted)">${fmtSize(x.file.size)}</div></div>
    ${modeSel(x.mode,`F.files[${i}].mode=this.value`)}<button class="btn btn-sm btn-icon btn-danger" onclick="F.files.splice(${i},1);renderSelFiles()">${ic('x')}</button></div>`).join('');
}
function addLinkRow(){ F.links.push({name:'',url:''}); renderLinkRows(); }
function renderLinkRows(){
  $('#fLinks').innerHTML=F.links.map((l,i)=>`<div class="linkrow"><input class="inp" placeholder="${esc(t('linkName'))}" value="${esc(l.name)}" oninput="F.links[${i}].name=this.value">
    <input class="inp" placeholder="${esc(t('linkUrl'))}" value="${esc(l.url)}" oninput="F.links[${i}].url=this.value"><span></span>
    <button class="btn btn-sm btn-icon btn-danger" onclick="F.links.splice(${i},1);renderLinkRows()">${ic('x')}</button></div>`).join('');
}
function collectDoc(){
  const g=id=>$('#'+id).value;
  return {catId:g('fCat'),docNo:g('fNo'),docDate:g('fDate'),fromName:g('fFrom'),toName:g('fTo'),title:g('fTitle'),description:g('fDesc'),
    refTo:g('fRef'),enclosures:g('fEnc'),purposeId:g('fPur'),handler:g('fHandler'),location:g('fLoc'),retainYears:g('fRet'),expireDate:g('fExp'),
    follow:$('#fFollow').checked,dueDays:g('fDays'),dueMode:document.querySelector('input[name=fMode]:checked').value,dueDate:g('fDue'),
    remark:g('fRemark'),tags:g('fTags'),deptIds:F.deptIds};
}
async function saveDoc(alsoTpl){
  const b1=$('#fSave'),b2=$('#fSaveT'); b1.disabled=b2.disabled=true; const old=b1.textContent; b1.textContent=t('saving');
  try{
    const c=collectDoc();
    const r=await API('docs.save',{...c,docId:F.docId,removeFileIds:F.removeIds,modes:F.modes,links:F.links.filter(l=>l.url.trim())});
    if(alsoTpl){
      const tp={...c}; delete tp.docNo; delete tp.docDate; delete tp.expireDate; delete tp.dueDate;
      try{ await API('tpl.save',{name:c.title,catId:c.catId,data:tp}); }catch(e){ toast(errMsg(e),'error'); }
    }
    if(F.files.length){
      $('#fProg').classList.remove('hide');
      for(let i=0;i<F.files.length;i++){
        const x=F.files[i];
        $('#fProgT').textContent=`${t('uploading')} ${i+1}/${F.files.length} — ${x.file.name}`;
        $('#fProgB').style.width=(i/F.files.length*100)+'%';
        const b64=await readB64(x.file);
        await API('files.upload',{docId:r.docId,name:x.file.name,mime:x.file.type,mode:x.mode,base64:b64});
      }
      $('#fProgB').style.width='100%';
    }
    closeModal(); toast(t('saved')+' · '+t('regNo')+' '+r.regNo); await loadBoot();
    S.view==='register'?loadReg():(S.view==='documents'?loadDocs():go('documents'));
  }catch(e){ toast(errMsg(e),'error'); b1.disabled=b2.disabled=false; b1.textContent=old; }
}

/* ============================================================
   Admin: Users
   ============================================================ */
async function viewUsers(el){
  el.innerHTML=`<div class="page-h"><div><h2>${t('users')}</h2></div><button class="btn btn-primary" onclick="openUser()">${ic('plus')}${t('addUser')}</button></div><div class="card tbl-wrap" id="ut"><div class="skel"></div></div>`;
  await act(async()=>{ S.admin.users=await API('users.list'); renderUsers(); });
}
function renderUsers(){
  $('#ut').innerHTML=`<table><thead><tr><th>${t('fullName')}</th><th>${t('username')}</th><th>${t('dept')}</th><th>${t('role')}</th><th>${t('permUpload')}</th><th>${t('permDl')}</th><th>${t('status')}</th><th>${t('lastLogin')}</th><th></th></tr></thead><tbody>
  ${S.admin.users.map(u=>`<tr><td><b>${esc(u.FullName)}</b></td><td>${esc(u.Username)}</td><td>${esc(deptName(u.DeptID))}</td>
    <td><span class="badge ${u.Role==='admin'?'':'gray'}">${u.Role==='admin'?t('admin_r'):t('member')}</span></td>
    <td>${u.CanUpload?`<span class="tick" style="width:22px;height:22px">${ic('check')}</span>`:'—'}</td><td>${u.CanDownload?`<span class="tick" style="width:22px;height:22px">${ic('check')}</span>`:'—'}</td>
    <td><span class="badge ${u.Active?'ok':'red'}">${u.Active?t('active'):t('inactive')}</span></td><td style="color:var(--muted);font-size:13px">${fmtDate(u.LastLogin)}</td>

function openUser(id){
  const u=id?S.admin.users.find(x=>x.UserID===id):{Role:'member',CanUpload:false,CanDownload:true,Active:true,Lang:'th',DeptID:''};
  modal(`<div class="modal-h"><h3>${id?t('editUser'):t('addUser')}</h3><button class="btn btn-sm btn-icon" onclick="closeModal()">${ic('x')}</button></div><div class="modal-b">
    <div class="row"><div class="field"><label>${t('username')} *</label><input class="inp" id="uU" value="${esc(u.Username||'')}"></div>
      <div class="field"><label>${t('fullName')} *</label><input class="inp" id="uN" value="${esc(u.FullName||'')}"></div></div>
    ${id?'':`<div class="field"><label>${t('password')} * <span style="font-weight:400">(${t('pwHint')})</span></label><input class="inp" id="uP" type="text" autocomplete="off"></div>`}
    <div class="row"><div class="field"><label>${t('dept')} *</label><select class="inp" id="uD"><option value="">—</option>${S.boot.departments.filter(d=>d.Active||d.DeptID===u.DeptID).map(d=>`<option value="${d.DeptID}" ${u.DeptID===d.DeptID?'selected':''}>${esc(lname(d))}</option>`).join('')}</select></div>
      <div class="field"><label>${t('role')}</label><select class="inp" id="uR"><option value="member" ${u.Role==='member'?'selected':''}>${t('member')}</option><option value="admin" ${u.Role==='admin'?'selected':''}>${t('admin_r')}</option></select></div></div>
    <div style="display:grid;gap:12px;margin:4px 0 8px"><label class="chk"><input type="checkbox" id="uUp" ${u.CanUpload?'checked':''}>${t('permUpload')}</label>
      <label class="chk"><input type="checkbox" id="uDl" ${u.CanDownload?'checked':''}>${t('permDl')}</label>
      <label class="chk"><input type="checkbox" id="uA" ${u.Active?'checked':''}>${t('active')}</label></div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" onclick="saveUser('${id||''}')">${t('save')}</button></div>`);
}
function saveUser(id){
  act(async()=>{
    await API('users.save',{userId:id||null,username:$('#uU').value,fullName:$('#uN').value,password:id?undefined:$('#uP').value,deptId:$('#uD').value,
      role:$('#uR').value,canUpload:$('#uUp').checked,canDownload:$('#uDl').checked,active:$('#uA').checked,lang:'th'});
    closeModal(); toast(t('saved')); S.admin.users=await API('users.list'); renderUsers();
    if(id===S.user.UserID) await loadBoot();
  });
}
function resetPw(id){
  const u=S.admin.users.find(x=>x.UserID===id);
  modal(`<div class="modal-h"><h3>${t('resetPw')}: ${esc(u.FullName)}</h3><button class="btn btn-sm btn-icon" onclick="closeModal()">${ic('x')}</button></div>
   <div class="modal-b"><div class="field"><label>${t('newPw')} (${t('pwHint')})</label><input class="inp" id="rp" type="text" autocomplete="off"></div></div>
   <div class="modal-f"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" onclick="act(async()=>{await API('users.reset',{userId:'${id}',password:$('#rp').value});closeModal();toast(t('saved'))})">${t('save')}</button></div>`,'sm');
}
function openPassword(){
  closeMenu();
  modal(`<div class="modal-h"><h3>${t('changePw')}</h3><button class="btn btn-sm btn-icon" onclick="closeModal()">${ic('x')}</button></div>
   <div class="modal-b"><div class="field"><label>${t('oldPw')}</label><input class="inp" id="pw0" type="password"></div>
   <div class="field"><label>${t('newPw')} (${t('pwHint')})</label><input class="inp" id="pw1" type="password"></div></div>
   <div class="modal-f"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" onclick="act(async()=>{await API('me.password',{oldPassword:$('#pw0').value,newPassword:$('#pw1').value});closeModal();toast(t('saved'))})">${t('save')}</button></div>`,'sm');

/* ============================================================
   Admin: Departments / Categories (shared module)
   ============================================================ */
const SIMPLE={
  depts:{list:()=>S.boot.departments,id:'DeptID',title:()=>t('departments'),add:()=>t('addDept'),edit:()=>t('editDept')},
  cats:{list:()=>S.boot.categories,id:'CatID',title:()=>t('docType'),add:()=>t('addCat'),edit:()=>t('editCat'),extra:true},
  purposes:{list:()=>S.boot.purposes,id:'PurposeID',title:()=>t('purposes'),add:()=>t('addPurpose'),edit:()=>t('editPurpose')}
};
const dirName = v => ({in:t('dIn'),internal:t('dInternal'),out:t('dOut'),other:t('dOther')}[v]||t('dOther'));
function viewSimple(el,kind){
  const c=SIMPLE[kind], list=c.list(), idf=c.id;
  el.innerHTML=`<div class="page-h"><div><h2>${c.title()}</h2></div><button class="btn btn-primary" onclick="openSimple('${kind}')">${ic('plus')}${c.add()}</button></div>
   <div class="card tbl-wrap"><table><thead><tr><th>${t('nameTH')}</th><th>${t('nameEN')}</th>${c.extra?`<th>${t('direction')}</th><th>${t('prefix')}</th>`:''}<th>${t('status')}</th><th></th></tr></thead><tbody>
   ${list.map(x=>`<tr><td><b>${esc(x.NameTH)}</b></td><td>${esc(x.NameEN)}</td>${c.extra?`<td>${dirName(x.Direction)}</td><td>${esc(x.Prefix)}</td>`:''}
     <td><span class="badge ${x.Active?'ok':'red'}">${x.Active?t('active'):t('inactive')}</span></td>
     <td><div class="acts"><button class="btn btn-sm btn-icon" onclick="openSimple('${kind}','${x[idf]}')">${ic('edit')}</button>
     <button class="btn btn-sm btn-icon btn-danger" onclick="delSimple('${kind}','${x[idf]}')">${ic('trash')}</button></div></td></tr>`).join('')}</tbody></table></div>`;
}
function openSimple(kind,id){
  const c=SIMPLE[kind], x=id?c.list().find(i=>i[c.id]===id):{NameTH:'',NameEN:'',Active:true,Direction:'other',Prefix:''};
  modal(`<div class="modal-h"><h3>${id?c.edit():c.add()}</h3><button class="btn btn-sm btn-icon" onclick="closeModal()">${ic('x')}</button></div>
   <div class="modal-b"><div class="field"><label>${t('nameTH')}</label><input class="inp" id="sTH" value="${esc(x.NameTH)}"></div>
   <div class="field"><label>${t('nameEN')}</label><input class="inp" id="sEN" value="${esc(x.NameEN)}"></div>
   ${c.extra?`<div class="field"><label>${t('direction')}</label><select class="inp" id="sDir">${['in','internal','out','other'].map(v=>`<option value="${v}" ${x.Direction===v?'selected':''}>${dirName(v)}</option>`).join('')}</select></div>
   <div class="field"><label>${t('prefix')}</label><input class="inp" id="sPre" value="${esc(x.Prefix)}" placeholder="กห0619.8/"></div>`:''}
   <label class="chk"><input type="checkbox" id="sA" ${x.Active?'checked':''}>${t('active')}</label></div>
   <div class="modal-f"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" onclick="saveSimple('${kind}','${id||''}')">${t('save')}</button></div>`,'sm');
}
function saveSimple(kind,id){
  const c=SIMPLE[kind];
  act(async()=>{ const p={id:id||null,nameTH:$('#sTH').value,nameEN:$('#sEN').value,active:$('#sA').checked};
    if(c.extra){ p.direction=$('#sDir').value; p.prefix=$('#sPre').value; }
    await API(kind+'.save',p); closeModal(); toast(t('saved')); await loadBoot(); viewSimple($('#view'),kind); });
}
async function delSimple(kind,id){
  if(!await confirmBox(t('confirm')+'?')) return;
  act(async()=>{ await API(kind+'.delete',{id}); toast(t('deleted')); await loadBoot(); viewSimple($('#view'),kind); });
}

/* ============================================================
   Admin: Logs
   ============================================================ */
function viewLogs(el){
  el.innerHTML=`<div class="page-h"><div><h2>${t('logs')}</h2></div><button class="btn" onclick="exportLogs()">${ic('download')}${t('exportCsv')}</button></div>
   <div class="toolbar"><div class="grow">${ic('search')}<input class="inp" value="${esc(S.logQ)}" placeholder="${esc(t('search'))}" oninput="onLogSearch(this.value)"></div>
     <select class="inp" onchange="S.logAct=this.value;S.logPage=1;loadLogs()"><option value="">${t('allActions')}</option>
       <option value="download" ${S.logAct==='download'?'selected':''}>${t('aDownload')}</option><option value="view" ${S.logAct==='view'?'selected':''}>${t('aView')}</option><option value="link" ${S.logAct==='link'?'selected':''}>${t('aLink')}</option></select></div>
   <div class="card tbl-wrap" id="lt"><div class="skel"></div></div><div id="pg"></div>`;
  loadLogs();
}
const onLogSearch=debounce(v=>{S.logQ=v;S.logPage=1;loadLogs()},350);
async function loadLogs(){
  await act(async()=>{
    S.logs=await API('logs.list',{q:S.logQ,action:S.logAct,page:S.logPage,size:20});
    const aL={download:t('aDownload'),view:t('aView'),link:t('aLink')};
    $('#lt').innerHTML = S.logs.items.length ? `<table><thead><tr><th>${t('time')}</th><th>${t('user')}</th><th>${t('dept')}</th><th>${t('file')}</th><th>${t('documents')}</th><th>${t('action')}</th></tr></thead><tbody>
     ${S.logs.items.map(l=>`<tr><td style="white-space:nowrap">${fmtDate(l.At)}</td><td>${esc(l.UserName)}</td><td>${esc(deptName(l.DeptID))}</td><td>${esc(l.FileName)}</td><td>${esc(l.DocTitle)}</td><td><span class="badge gray">${aL[l.Action]||l.Action}</span></td></tr>`).join('')}</tbody></table>` : emptyBox();
    const pages=Math.ceil(S.logs.total/S.logs.size)||1, p=S.logs.page;
    $('#pg').innerHTML=pages>1?`<div class="pager"><button class="btn btn-sm" ${p<=1?'disabled':''} onclick="S.logPage=${p-1};loadLogs()">‹</button><span style="color:var(--muted)">${p} / ${pages}</span><button class="btn btn-sm" ${p>=pages?'disabled':''} onclick="S.logPage=${p+1};loadLogs()">›</button></div>`:'';
  });
}
function exportLogs(){
  act(async()=>{
    const r=await API('logs.list',{q:S.logQ,action:S.logAct,page:1,size:2000});
    const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const rows=[['Time','User','Department','File','Document','Action']].concat(r.items.map(l=>[l.At,l.UserName,deptName(l.DeptID),l.FileName,l.DocTitle,l.Action]));
    saveBlob(new Blob(['\ufeff'+rows.map(x=>x.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),'edms-logs.csv');
  });
}
